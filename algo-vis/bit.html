<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树状数组 BIT 树形结构</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#1a1a2e; color:#eee; display:flex; flex-direction:column; align-items:center; padding:30px 20px; min-height:100vh; }
h2 { margin-bottom:4px; }
.sub { color:#888; font-size:13px; margin-bottom:15px; }

.controls { margin:15px 0; padding:12px 18px; background:#16213e; border:1px solid #0f3460; border-radius:8px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
.controls input { width:70px; padding:7px; font-size:15px; border:1px solid #0f3460; border-radius:4px; background:#0a0f1e; color:#eee; text-align:center; }
.controls button { padding:8px 16px; font-size:14px; cursor:pointer; border:none; border-radius:4px; color:#fff; font-weight:600; transition:opacity 0.2s; }
.controls button:hover { opacity:0.8; }
.btn-add { background:#ff9800; }
.btn-sum { background:#03a9f4; }
.btn-build { background:#4caf50; }
.btn-reset { background:#555; }

.tree-wrap { position:relative; margin:20px 0; overflow-x:auto; max-width:100%; padding:10px; }
.tree-wrap canvas { display:block; }

.info-row { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.info-card { background:#16213e; border:1px solid #0f3460; border-radius:8px; padding:12px 18px; font-size:13px; min-width:200px; }
.info-card h4 { color:#e94560; margin-bottom:6px; }
.info-val { color:#ff9800; font-weight:700; }

#log-panel { margin-top:15px; width:100%; max-width:700px; background:#0d1117; color:#c9d1d9; padding:12px 15px; border-radius:8px; font-family:Consolas,monospace; font-size:12px; min-height:60px; border:1px solid #30363d; max-height:200px; overflow-y:auto; }
.log-entry { margin:3px 0; padding-bottom:3px; border-bottom:1px dashed #21262d; }
</style>
</head>
<body>
<h2>树状数组 BIT — 真实树形结构</h2>
<div class="sub">每个节点 BIT[i] 覆盖区间 [i-lowbit(i)+1, i]，父节点 = i + lowbit(i)</div>

<div class="controls">
  <label>N: <input id="nInput" type="number" min="4" max="32" value="16"></label>
  <button class="btn-build" onclick="build()">构建</button>
  <label>位置: <input id="xInput" type="number" min="1" max="32" value="6"></label>
  <button class="btn-add" onclick="runAdd()">add(x)</button>
  <button class="btn-sum" onclick="runSum()">sum(x)</button>
  <button class="btn-reset" onclick="resetAnim()">重置</button>
</div>

<div class="tree-wrap" id="tree-wrap">
  <canvas id="treeCanvas"></canvas>
</div>

<div class="info-row">
  <div class="info-card">
    <h4>A[1..<span id="info-n">16</span>] 原数组</h4>
    <div id="info-a"></div>
  </div>
  <div class="info-card">
    <h4>BIT[1..<span id="info-n2">16</span>] 树状数组</h4>
    <div id="info-bit"></div>
  </div>
</div>

<div id="log-panel"></div>

<script>
let N=16, A=[], BIT=[], animating=false;
const canvas=document.getElementById('treeCanvas');
const ctx=canvas.getContext('2d');

function lowbit(x){return x&-x;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function build(){
  if(animating)return;
  N=parseInt(document.getElementById('nInput').value)||16;
  document.getElementById('info-n').textContent=N;
  document.getElementById('info-n2').textContent=N;
  document.getElementById('xInput').max=N;
  A=new Array(N+1).fill(0);
  BIT=new Array(N+1).fill(0);
  logPanel.innerHTML='';
  // Random init
  for(let i=1;i<=N;i++){A[i]=Math.floor(Math.random()*9)+1; _bitAdd(i,A[i]);}
  updateInfo();
  drawTree();
  log('构建完成。N='+N);
}

function _bitAdd(i,v){while(i<=N){BIT[i]+=v;i+=lowbit(i);}}

function updateInfo(){
  document.getElementById('info-a').innerHTML=A.slice(1).map((v,i)=>'['+(i+1)+']='+v).join(' ');
  document.getElementById('info-bit').innerHTML=BIT.slice(1).map((v,i)=>'['+(i+1)+']='+v).join(' ');
}

function resetAnim(){
  animating=false;
  updateInfo();
  drawTree();
  logPanel.innerHTML='<div class="log-entry">> 重置</div>';
}

function log(msg){
  const d=document.createElement('div');d.className='log-entry';d.textContent='> '+msg;
  logPanel.appendChild(d);logPanel.scrollTop=logPanel.scrollHeight;
}

// ---- Tree Drawing ----
function drawTree(highlightCells=null, hlColor='#ff9800'){
  const levels={}; // lowbit -> [indices]
  for(let i=1;i<=N;i++){
    const lb=lowbit(i);
    if(!levels[lb])levels[lb]=[];
    levels[lb].push(i);
  }
  const lvKeys=Object.keys(levels).map(Number).sort((a,b)=>a-b); // 1,2,4,8...
  const maxLevel=lvKeys[lvKeys.length-1];
  const maxIdx=Math.max(...lvKeys.map(k=>levels[k].length));

  const cellW=58, cellH=38, gapX=10, gapY=60, padX=40, padY=30;
  const colsPerLevel={};
  let totalW=0;
  lvKeys.forEach(k=>{colsPerLevel[k]=0;totalW=Math.max(totalW,levels[k].length*cellW+(levels[k].length-1)*gapX);});
  totalW+=padX*2;
  const totalH=lvKeys.length*(cellH+gapY)+padY*2;

  canvas.width=totalW;
  canvas.height=totalH;
  ctx.clearRect(0,0,totalW,totalH);

  // Store cell positions for drawing lines
  const posMap={};

  // Draw cells bottom-up (level 1 at bottom)
  lvKeys.forEach((lb,li)=>{
    const row=lvKeys.length-1-li; // 0=top, bottom=lowbit=1
    const arr=levels[lb].sort((a,b)=>a-b);
    const rowW=arr.length*cellW+(arr.length-1)*gapX;
    const startX=(totalW-rowW)/2;

    arr.forEach((idx,ci)=>{
      const cx=startX+ci*(cellW+gapX);
      const cy=padY+row*(cellH+gapY);
      posMap[idx]={x:cx+cellW/2,y:cy+cellH/2,lb,row};

      let fill='#0f3460',border='#1a4a7a',text='#ccc';
      if(highlightCells&&highlightCells.has(idx)){
        fill=hlColor;border='#fff';text='#fff';
      }
      // Rounded rect
      const r=6;
      ctx.beginPath();ctx.moveTo(cx+r,cy);ctx.lineTo(cx+cellW-r,cy);
      ctx.quadraticCurveTo(cx+cellW,cy,cx+cellW,cy+r);
      ctx.lineTo(cx+cellW,cy+cellH-r);ctx.quadraticCurveTo(cx+cellW,cy+cellH,cx+cellW-r,cy+cellH);
      ctx.lineTo(cx+r,cy+cellH);ctx.quadraticCurveTo(cx,cy+cellH,cx,cy+cellH-r);
      ctx.lineTo(cx,cy+r);ctx.quadraticCurveTo(cx,cy,cx+r,cy);ctx.closePath();
      ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle=border;ctx.lineWidth=2;ctx.stroke();

      // Text
      ctx.fillStyle=text;ctx.font='bold 14px Consolas';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText('BIT['+idx+']',cx+cellW/2,cy+5);
      ctx.font='12px Consolas';ctx.fillText('= '+BIT[idx]+'  ['+(idx-lowbit(idx)+1)+','+idx+']',cx+cellW/2,cy+22);
    });
  });

  // Draw lines from child to parent
  ctx.strokeStyle='rgba(233,69,96,0.4)';ctx.lineWidth=1.5;
  for(let i=1;i<=N;i++){
    const p=i+lowbit(i);
    if(p<=N&&posMap[i]&&posMap[p]){
      const c=posMap[i],par=posMap[p];
      ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(par.x,par.y);ctx.stroke();
    }
  }

  // Level labels on left
  ctx.fillStyle='#888';ctx.font='11px Consolas';ctx.textAlign='right';
  lvKeys.forEach((lb,li)=>{
    const row=lvKeys.length-1-li;
    const y=padY+row*(cellH+gapY)+cellH/2;
    ctx.fillText('lowbit='+lb,padX-8,y+4);
  });
}

async function runAdd(){
  if(animating)return;
  let x=parseInt(document.getElementById('xInput').value);
  if(x<1||x>N)return;
  animating=true;resetAnim();
  log('add('+x+',1) — 从 BIT['+x+'] 向上传递');

  // Highlight A[x]
  A[x]+=1;updateInfo();
  const hl=new Set();let cur=x;
  while(cur<=N){hl.add(cur);cur+=lowbit(cur);}
  drawTree(hl,'#ff9800');
  await sleep(400);

  let step=1;
  cur=x;
  while(cur<=N){
    log('[步'+step+'] BIT['+cur+'] += 1  (x='+cur+', lowbit='+lowbit(cur)+')');
    BIT[cur]+=1;
    const s=new Set();let tmp=x;while(tmp<=N){if(tmp>cur)s.add(tmp);tmp+=lowbit(tmp);}
    if(cur<=N)s.add(cur);
    drawTree(s,'#ff9800');
    updateInfo();
    await sleep(600);
    cur+=lowbit(cur);
    step++;
  }
  log('更新完成');
  drawTree();
  updateInfo();
  animating=false;
}

async function runSum(){
  if(animating)return;
  let x=parseInt(document.getElementById('xInput').value);
  if(x<1||x>N)return;
  animating=true;resetAnim();
  log('sum('+x+') — 从 BIT['+x+'] 向下累加');

  const hl=new Set();let cur=x;
  while(cur>0){hl.add(cur);cur-=lowbit(cur);}
  drawTree(hl,'#03a9f4');
  await sleep(400);

  let sum=0,step=1,parts=[];
  cur=x;
  while(cur>0){
    log('[步'+step+'] += BIT['+cur+'] = '+BIT[cur]+'  (x='+cur+', lowbit='+lowbit(cur)+')');
    sum+=BIT[cur];parts.push('BIT['+cur+']');
    const s=new Set();let tmp=x;while(tmp>0){if(tmp<cur)s.add(tmp);tmp-=lowbit(tmp);}
    if(cur>0)s.add(cur);
    drawTree(s,'#03a9f4');
    updateInfo();
    await sleep(600);
    cur-=lowbit(cur);
    step++;
  }
  log('前缀和 = '+parts.join(' + ')+' = '+sum);
  drawTree();
  updateInfo();
  animating=false;
}

build();
</script>
</body>
</html>
