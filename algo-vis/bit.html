<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树状数组 BIT 柱状结构</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;padding:30px 20px;min-height:100vh}
h2{margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:15px}
.controls{margin:15px 0;padding:12px 18px;background:#16213e;border:1px solid #0f3460;border-radius:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.controls input{width:70px;padding:7px;font-size:15px;border:1px solid #0f3460;border-radius:4px;background:#0a0f1e;color:#eee;text-align:center}
.controls button{padding:8px 16px;font-size:14px;cursor:pointer;border:none;border-radius:4px;color:#fff;font-weight:600;transition:opacity 0.2s}
.controls button:hover{opacity:0.8}
.btn-add{background:#ff9800}
.btn-sum{background:#03a9f4}
.btn-reset{background:#555}

canvas{display:block;margin:10px 0}

#log-panel{margin-top:15px;width:100%;max-width:700px;background:#0d1117;color:#c9d1d9;padding:12px 15px;border-radius:8px;font-family:Consolas,monospace;font-size:12px;min-height:60px;border:1px solid #30363d;max-height:180px;overflow-y:auto}
.log-entry{margin:3px 0;padding-bottom:3px;border-bottom:1px dashed #21262d}
</style>
</head>
<body>
<h2>树状数组 BIT — 柱状高度 = lowbit</h2>
<div class="sub">每列高度 = lowbit(i) = 该节点覆盖的元素个数</div>

<div class="controls">
  <label>N: <input id="nInput" type="number" min="4" max="16" value="16"></label>
  <button class="btn-add" onclick="build()">构建</button>
  <label>位置: <input id="xInput" type="number" min="1" max="16" value="6"></label>
  <button class="btn-add" onclick="runAdd()" style="background:#ff9800">add(x)</button>
  <button class="btn-sum" onclick="runSum()">sum(x)</button>
  <button class="btn-reset" onclick="build()">重置</button>
</div>

<canvas id="c"></canvas>
<div id="log-panel"></div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const logPanel=document.getElementById('log-panel');
let N=16,A=[],BIT=[],animating=false;

function lowbit(x){return x&-x;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function log(msg){const d=document.createElement('div');d.className='log-entry';d.textContent='> '+msg;logPanel.appendChild(d);logPanel.scrollTop=logPanel.scrollHeight;}

function build(){
  if(animating)return;
  N=parseInt(document.getElementById('nInput').value)||16;
  document.getElementById('xInput').max=N;
  A=new Array(N+1).fill(0);BIT=new Array(N+1).fill(0);
  logPanel.innerHTML='';
  for(let i=1;i<=N;i++){A[i]=Math.floor(Math.random()*9)+1;}
  for(let i=1;i<=N;i++){let j=i;while(j<=N){BIT[j]+=A[i];j+=lowbit(j);}}
  draw();
  log('构建完成。N='+N+', A随机初始化');
}

function draw(hlCells=null,hlColor='#ff9800'){
  const baseY=380, maxH=280, cellW=38, gap=6, padLeft=50, padTop=20;
  const totalW=padLeft*2+N*cellW+(N-1)*gap;
  c.width=totalW;c.height=baseY+70;

  ctx.clearRect(0,0,c.width,c.height);

  // Draw A row at bottom
  ctx.fillStyle='#888';ctx.font='12px Consolas';ctx.textAlign='center';
  for(let i=1;i<=N;i++){
    const x=padLeft+(i-1)*(cellW+gap);
    const y=baseY+10;
    // A cell
    ctx.fillStyle='#0f3460';ctx.strokeStyle='#1a4a7a';ctx.lineWidth=1.5;
    ctx.fillRect(x,y,cellW,28);
    ctx.strokeRect(x,y,cellW,28);
    ctx.fillStyle='#ccc';ctx.font='bold 13px Consolas';
    ctx.fillText(A[i],x+cellW/2,y+20);
    // A label
    ctx.fillStyle='#888';ctx.font='11px Consolas';
    ctx.fillText('A['+i+']',x+cellW/2,y+48);
  }

  // Draw BIT columns — height proportional to lowbit
  const maxLb=lowbit(N);
  for(let i=1;i<=N;i++){
    const x=padLeft+(i-1)*(cellW+gap);
    const lb=lowbit(i);
    const h=(lb/maxLb)*maxH;
    const y=baseY-h;

    let fill='#0f3460',stroke='#1a4a7a';
    if(hlCells&&hlCells.has(i)){fill=hlColor;stroke='#fff';}

    // Draw column
    ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=2;
    const rx=4;
    ctx.beginPath();ctx.moveTo(x+rx,y);ctx.lineTo(x+cellW-rx,y);
    ctx.quadraticCurveTo(x+cellW,y,x+cellW,y+rx);
    ctx.lineTo(x+cellW,y+h);ctx.lineTo(x,y+h);
    ctx.lineTo(x,y+rx);ctx.quadraticCurveTo(x,y,x+rx,y);
    ctx.closePath();ctx.fill();ctx.stroke();

    // BIT value inside column
    ctx.fillStyle=hlCells&&hlCells.has(i)?'#fff':'#ccc';
    ctx.font='bold 14px Consolas';ctx.textAlign='center';
    const midY=y+h/2;
    ctx.fillText(BIT[i],x+cellW/2,midY+5);

    // Index and range below column
    ctx.fillStyle='#888';ctx.font='11px Consolas';
    ctx.fillText('BIT['+i+']',x+cellW/2,baseY+10);
    // Lowbit indicator above column
    ctx.fillText('w='+lb, x+cellW/2, y-4);

    // Draw parent line upward
    const p=i+lowbit(i);
    if(p<=N){
      const px=padLeft+(p-1)*(cellW+gap)+cellW/2;
      ctx.strokeStyle='rgba(233,69,96,0.3)';ctx.lineWidth=1;
      ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x+cellW/2,y);ctx.lineTo(px,y);ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Title
  ctx.fillStyle='#eee';ctx.font='bold 16px Consolas';ctx.textAlign='left';
  ctx.fillText('BIT 柱状图 (w = lowbit = 覆盖宽度)',padLeft,padTop);
}

async function runAdd(){
  if(animating)return;
  let x=parseInt(document.getElementById('xInput').value);
  if(x<1||x>N)return;
  animating=true;logPanel.innerHTML='';
  log('add('+x+',1): A['+x+'] += 1');

  A[x]+=1;
  let cur=x,step=1;
  while(cur<=N){
    const hl=new Set([cur]);
    draw(hl,'#ff9800');
    BIT[cur]+=1;
    log('[步'+step+'] BIT['+cur+'] += 1 → '+BIT[cur]+'  (lowbit='+lowbit(cur)+')');
    await sleep(500);
    cur+=lowbit(cur);
    step++;
  }
  draw();
  log('完成');
  animating=false;
}

async function runSum(){
  if(animating)return;
  let x=parseInt(document.getElementById('xInput').value);
  if(x<1||x>N)return;
  animating=true;logPanel.innerHTML='';
  log('sum('+x+'): 前缀和查询');

  let sum=0,cur=x,step=1,parts=[];
  while(cur>0){
    const hl=new Set([cur]);
    draw(hl,'#03a9f4');
    sum+=BIT[cur];parts.push('BIT['+cur+']');
    log('[步'+step+'] += BIT['+cur+'] = '+BIT[cur]+'  (lowbit='+lowbit(cur)+')');
    await sleep(500);
    cur-=lowbit(cur);
    step++;
  }
  draw();
  log('sum[1..'+x+'] = '+parts.join(' + ')+' = '+sum);
  animating=false;
}

build();
</script>
</body>
</html>
