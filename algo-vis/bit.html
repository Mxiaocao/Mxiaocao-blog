<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树状数组 (BIT) 跳跃演示</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        h2 { margin-bottom: 5px; }
        p { color: #888; }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #0a0f1e;
            color: #eee;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
            transition: opacity 0.2s;
            font-weight: 600;
        }
        button:hover { opacity: 0.8; }
        .btn-add { background-color: #ff9800; }
        .btn-sum { background-color: #03a9f4; }
        .btn-reset { background-color: #555; }

        .viz-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        .row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cell-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f3460;
            border: 2px solid #1a4a7a;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #ccc;
        }
        .label {
            font-size: 12px;
            color: #888;
        }

        .highlight-add {
            background-color: #ff9800 !important;
            color: #fff;
            border-color: #ffb74d;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.5);
        }
        .highlight-sum {
            background-color: #03a9f4 !important;
            color: #fff;
            border-color: #29b6f6;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(3, 169, 244, 0.5);
        }

        #log-panel {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            background: #0d1117;
            color: #c9d1d9;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            min-height: 150px;
            border: 1px solid #30363d;
            max-height: 350px;
            overflow-y: auto;
        }
        .log-entry { margin: 4px 0; padding-bottom: 4px; border-bottom: 1px dashed #21262d; }
        .log-header { color: #f1c40f; margin-bottom: 10px; font-weight: 700; }
    </style>
</head>
<body>

    <h2>树状数组跳跃引擎</h2>
    <p>观察 C 数组的低位 (lowbit) 跳跃轨迹 — x → x ± lowbit(x)</p>

    <div class="controls">
        <label for="xInput">位置 x (1-16): </label>
        <input type="number" id="xInput" min="1" max="16" value="6">
        <button class="btn-add" onclick="runAdd()">模拟 add(x)</button>
        <button class="btn-sum" onclick="runSum()">模拟 sum(x)</button>
        <button class="btn-reset" onclick="resetViz()">重置</button>
    </div>

    <div class="viz-container">
        <div class="row" id="c-row"></div>
        <div class="row" id="a-row"></div>
    </div>

    <div id="log-panel">
        <div class="log-header">> 终端就绪。等待操作...</div>
    </div>

    <script>
        const N = 16;
        const cRow = document.getElementById('c-row');
        const aRow = document.getElementById('a-row');
        const logPanel = document.getElementById('log-panel');
        let isAnimating = false;

        const lowbit = (x) => x & -x;
        const toBin = (x) => x.toString(2).padStart(5, '0');

        function initUI() {
            cRow.innerHTML = '';
            aRow.innerHTML = '';
            for (let i = 1; i <= N; i++) {
                const cContainer = document.createElement('div');
                cContainer.className = 'cell-container';
                cContainer.innerHTML = '<div class="label">C['+i+']</div><div class="cell" id="c-'+i+'">0</div>';
                cRow.appendChild(cContainer);

                const aContainer = document.createElement('div');
                aContainer.className = 'cell-container';
                aContainer.innerHTML = '<div class="cell" id="a-'+i+'">0</div><div class="label">A['+i+']</div>';
                aRow.appendChild(aContainer);
            }
        }

        function resetViz() {
            if(isAnimating) return;
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('highlight-add', 'highlight-sum');
                el.innerText = '0';
            });
            logPanel.innerHTML = '<div class="log-header">> 状态已重置。</div>';
        }

        function log(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = '> ' + msg;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function runAdd() {
            if (isAnimating) return;
            let x = parseInt(document.getElementById('xInput').value);
            if (isNaN(x) || x < 1 || x > N) return alert("请输入 1 到 16 之间的有效数字");

            resetViz();
            isAnimating = true;
            log('=== 开始模拟 add('+x+', k) ===');
            log('目标：原数组 A['+x+'] 发生改变，开始向上寻找受牵连的 C 数组父节点');

            const aCell = document.getElementById('a-'+x);
            aCell.classList.add('highlight-add');
            aCell.innerText = '+k';
            await sleep(800);

            let step = 1;
            while (x <= N) {
                let lb = lowbit(x);
                log('[步数 '+step+'] 当前 x = '+x+' (二进制 '+toBin(x)+')。lowbit = '+lb+'。更新 C['+x+']');

                const cCell = document.getElementById('c-'+x);
                cCell.classList.add('highlight-add');
                cCell.innerText = '+k';

                await sleep(1000);
                x += lb;
                if (x <= N) log('       └─> 下一个跳跃点: '+(x - lb)+' + '+lb+' = '+x);
                step++;
            }
            log('=== 抵达边界 (x > 16)，更新结束 ===');
            isAnimating = false;
        }

        async function runSum() {
            if (isAnimating) return;
            let x = parseInt(document.getElementById('xInput').value);
            if (isNaN(x) || x < 1 || x > N) return alert("请输入 1 到 16 之间的有效数字");

            resetViz();
            isAnimating = true;
            log('=== 开始模拟 sum('+x+') ===');
            log('目标：剥洋葱式地将不重叠的 C 数组拼块加起来');

            let step = 1;
            let formula = [];
            while (x > 0) {
                let lb = lowbit(x);
                log('[步数 '+step+'] 当前 x = '+x+' (二进制 '+toBin(x)+')。lowbit = '+lb+'。拿到 C['+x+']');
                formula.push('C['+x+']');

                const cCell = document.getElementById('c-'+x);
                cCell.classList.add('highlight-sum');
                cCell.innerText = '✓';

                await sleep(1000);
                x -= lb;
                if(x > 0) log('       └─> 寻找左侧拼图块: '+(x + lb)+' - '+lb+' = '+x);
                step++;
            }
            log('=== 查询结束。前缀和 = '+formula.join(' + ')+' ===');
            isAnimating = false;
        }

        initUI();
    </script>
</body>
</html>
