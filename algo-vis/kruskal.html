<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kruskal 最小生成树可视化</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
h2 { margin-bottom: 20px; color: #e94560; }
.container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.graph-panel { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; }
.edge-panel { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; min-width: 260px; max-height: 360px; overflow-y: auto; }
.edge-panel h3, .dsu-panel h3 { margin-bottom: 10px; color: #e94560; text-align: center; font-size: 15px; }
.edge-item { padding: 8px 12px; margin: 4px 0; border-radius: 6px; font-size: 14px; font-weight: bold; transition: all 0.3s; background: #0f3460; border-left: 3px solid #1a508b; display: flex; justify-content: space-between; }
.edge-item.current { background: rgba(255,211,105,0.2); border-left-color: #ffd369; }
.edge-item.added { background: rgba(46,213,115,0.15); border-left-color: #2e8b57; color: #8fbc8f; }
.edge-item.rejected { background: rgba(233,69,96,0.1); border-left-color: #e94560; color: #888; text-decoration: line-through; }
.edge-item.pending { color: #aaa; }
.dsu-panel { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; min-width: 180px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 12px; text-align: center; border: 1px solid #0f3460; font-size: 14px; }
th { color: #888; font-size: 12px; font-weight: normal; }
td { font-weight: bold; transition: all 0.3s; }
.dsu-changed { background: rgba(255,211,105,0.3); animation: pulse 0.6s; }
.mst-edge { stroke: #2e8b57 !important; stroke-width: 3 !important; }
.current-edge { stroke: #ffd369 !important; stroke-width: 3 !important; stroke-dasharray: 8,4; animation: dash 0.5s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -24; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.2s; }
button:hover { transform: translateY(-2px); }
.btn-step { background: #e94560; color: #fff; }
.btn-auto { background: #0f3460; color: #fff; }
.btn-reset { background: #533483; color: #fff; }
.btn-speed { background: #222831; color: #eee; }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.info { margin-top: 15px; padding: 12px 20px; background: #16213e; border-radius: 8px; border-left: 3px solid #e94560; font-size: 15px; max-width: 700px; text-align: center; min-height: 24px; }
.info span { color: #e94560; font-weight: bold; }
.status { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
svg text { user-select: none; }
svg .edge-label { font-size: 14px; fill: #aaa; }
svg .node circle { transition: fill 0.3s; }
.input-panel { background: #16213e; border-radius: 12px; border: 1px solid #0f3460; max-width: 820px; width: 100%; margin-bottom: 20px; overflow: hidden; }
.input-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; user-select: none; background: rgba(233,69,96,0.08); transition: background 0.2s; }
.input-panel-header:hover { background: rgba(233,69,96,0.15); }
.input-panel-header h3 { margin: 0; font-size: 16px; color: #e94560; }
.toggle-icon { font-size: 14px; color: #e94560; transition: transform 0.3s; }
.input-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
.panel-body { padding: 16px 20px; transition: all 0.3s; overflow: hidden; }
.input-panel.collapsed .panel-body { max-height: 0; padding: 0 20px; opacity: 0; }
.input-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
.input-group { display: flex; flex-direction: column; gap: 4px; }
.input-group label { font-size: 13px; color: #aaa; }
.input-group input, .input-group textarea { background: #0f3460; border: 1px solid #1a508b; border-radius: 6px; color: #eee; padding: 8px 12px; font-size: 14px; font-family: 'Consolas','Courier New',monospace; outline: none; transition: border-color 0.2s; }
.input-group input:focus, .input-group textarea:focus { border-color: #e94560; }
.input-group input { width: 70px; }
.input-group textarea { width: 100%; min-width: 260px; height: 80px; resize: vertical; }
.preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.preset-btn { padding: 6px 14px; border: 1px solid #1a508b; border-radius: 6px; background: transparent; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.preset-btn:hover { border-color: #e94560; color: #eee; }
.preset-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.btn-build { padding: 10px 28px; border: none; border-radius: 8px; background: #00adb5; color: #fff; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.2s; }
.btn-build:hover { background: #018c93; transform: translateY(-1px); }
.error-msg { color: #e94560; font-size: 13px; min-height: 18px; margin-top: 2px; white-space: pre-line; }
.total-cost { margin-top: 10px; text-align: center; font-size: 15px; color: #46d573; }
</style>
</head>
<body>
<h2>Kruskal 最小生成树算法可视化</h2>
<div class="input-panel" id="inputPanel">
  <div class="input-panel-header" id="panelToggle"><h3>自定义图参数</h3><span class="toggle-icon">▼</span></div>
  <div class="panel-body">
    <div class="input-row">
      <div class="input-group"><label>节点数 N (2-8)</label><input type="number" id="nodeCount" min="2" max="8" value="3"></div>
      <div class="preset-btns" id="presetBtns"></div>
    </div>
    <div class="input-row">
      <div class="input-group" style="flex:1;min-width:280px;">
        <label>边列表（每行：u v w，无向边）</label>
        <textarea id="edgeInput" placeholder="1 2 1&#10;2 3 2&#10;1 3 10"></textarea>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="input-row"><button class="btn-build" id="btnBuild">生成图并重置</button></div>
  </div>
</div>
<div class="container">
  <div class="graph-panel"><svg id="graph" width="350" height="280"></svg></div>
  <div class="edge-panel">
    <h3>边列表（按权重排序）</h3>
    <div id="edgeList"></div>
    <div class="total-cost" id="totalCost"></div>
  </div>
  <div class="dsu-panel">
    <h3>并查集 (DSU)</h3>
    <table id="dsuTable"></table>
  </div>
</div>
<div class="info" id="info">准备开始</div>
<div class="status" id="status"></div>
<div class="controls">
  <button class="btn-step" id="btnStep">▶ 下一步</button>
  <button class="btn-auto" id="btnAuto">▶ 自动播放</button>
  <button class="btn-speed" id="btnSpeed">速度: 1x</button>
  <button class="btn-reset" id="btnReset">↻ 重置</button>
</div>

<script>
let N, graph, presets;
const INF = 999;
let steps = [], currentStep = 0, autoTimer = null, speed = 1;

function definePresets() {
  return {
    '3village': {
      name: '3村庄', nodeCount: 3,
      edges: [[1,2,1],[2,3,2],[1,3,10]]
    },
    '4node': {
      name: '4节点', nodeCount: 4,
      edges: [[1,2,3],[1,4,7],[2,3,2],[3,4,1],[2,4,9]]
    },
    '5complete': {
      name: '5完全图', nodeCount: 5,
      edges: [[1,2,1],[1,3,4],[1,4,3],[1,5,7],[2,3,2],[2,4,5],[2,5,8],[3,4,1],[3,5,6],[4,5,2]]
    }
  };
}

function parseEdgeInput(text) {
  const edges = [], errors = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(/\s+/);
    if (parts.length !== 3) { errors.push(`第${i+1}行需要3个数字，得到 ${parts.length} 个`); continue; }
    const u = Number(parts[0]), v = Number(parts[1]), w = Number(parts[2]);
    if (isNaN(u) || isNaN(v) || isNaN(w)) { errors.push(`第${i+1}行含非数字`); continue; }
    if (u < 1 || v < 1) { errors.push(`第${i+1}行节点编号必须 >= 1`); continue; }
    edges.push([u, v, w]);
  }
  return { edges, errors };
}

function generateGraph(nodeCount, edgeList) {
  const margin = 55;
  let R = nodeCount <= 4 ? 120 : nodeCount <= 6 ? 145 : 165;
  const side = 2 * (R + margin), cx = side / 2, cy = side / 2;
  const svg = document.getElementById('graph');
  svg.setAttribute('width', side); svg.setAttribute('height', side);
  svg.setAttribute('viewBox', `0 0 ${side} ${side}`);
  const nodes = [];
  for (let i = 1; i <= nodeCount; i++) {
    const angle = (2 * Math.PI * (i - 1)) / nodeCount - Math.PI / 2;
    nodes.push({ id: i, x: Math.round(cx + R * Math.cos(angle)), y: Math.round(cy + R * Math.sin(angle)), label: String(i) });
  }
  const edgeMap = new Map();
  for (const [u, v, w] of edgeList) {
    if (u === v || u < 1 || u > nodeCount || v < 1 || v > nodeCount) continue;
    const key = u < v ? `${u},${v}` : `${v},${u}`;
    if (!edgeMap.has(key) || w < edgeMap.get(key).w) edgeMap.set(key, { u: Math.min(u,v), v: Math.max(u,v), w });
  }
  graph = { nodes, edges: Array.from(edgeMap.values()) };
  N = nodeCount;
}

// ── Kruskal steps ──
function buildSteps() {
  // Sort edges by weight
  const sorted = [...graph.edges].sort((a, b) => a.w - b.w);

  // DSU init
  const fa = [];
  for (let i = 1; i <= N; i++) fa[i] = i;
  function find(x) { return fa[x] === x ? x : (fa[x] = find(fa[x])); }

  const mstEdges = [];
  const edgeStatus = sorted.map(() => 'pending'); // pending | added | rejected
  const dsuHistory = [];

  steps = [{ type: 'init', sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [], fa: [...fa], desc: `初始化：边按权重排序完毕，共 ${sorted.length} 条边。所有节点各自为政，并查集 fa[i]=i`, currentEdgeIdx: -1 }];

  for (let i = 0; i < sorted.length; i++) {
    const e = sorted[i];
    const oldFa = [...fa];
    const fu = find(e.u), fv = find(e.v);
    const beforeFa = [...fa];

    if (fu !== fv) {
      // Add to MST
      fa[fv] = fu; // union: fv's parent = fu
      edgeStatus[i] = 'added';
      mstEdges.push({ u: e.u, v: e.v, w: e.w });

      steps.push({
        type: 'check', desc: `边 ${e.u}-${e.v}（权${e.w}）：find(${e.u})=${fu}，find(${e.v})=${fv}，<span>老大不同，修！</span>`,
        sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [...mstEdges],
        fa: [...fa], currentEdgeIdx: i,
        detail: `并查集：fa[${e.v}]=${fu}（${e.v} 认 ${fu} 做老大）`
      });

      if (mstEdges.length === N - 1) {
        // If there are remaining edges after MST complete
        for (let j = i + 1; j < sorted.length; j++) {
          edgeStatus[j] = 'rejected';
        }
        steps.push({
          type: 'done_early', desc: `<span>MST 完成！</span> 已选 ${N-1} 条边，总花费 ${mstEdges.reduce((s,e)=>s+e.w,0)}。剩余边无需考虑`,
          sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [...mstEdges],
          fa: [...fa], currentEdgeIdx: -1
        });
        break;
      }
    } else {
      // Reject - would create cycle
      edgeStatus[i] = 'rejected';
      steps.push({
        type: 'reject', desc: `边 ${e.u}-${e.v}（权${e.w}）：find(${e.u})=find(${e.v})=${fu}，<span>老大相同，撕掉不修！</span>（会成环）`,
        sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [...mstEdges],
        fa: [...fa], currentEdgeIdx: i,
        detail: `跳过：${e.u} 和 ${e.v} 已经在同一个连通块`
      });
    }
  }

  if (mstEdges.length < N - 1) {
    steps.push({
      type: 'done_partial', desc: `边已全部检查，MST 不连通（仅 ${mstEdges.length} 条边，需 ${N-1} 条）`,
      sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [...mstEdges],
      fa: [...fa], currentEdgeIdx: -1
    });
  } else if (steps[steps.length-1].type !== 'done_early') {
    steps.push({
      type: 'done', desc: `<span>MST 完成！</span> 总花费 ${mstEdges.reduce((s,e)=>s+e.w,0)}`,
      sorted: [...sorted], edgeStatus: [...edgeStatus], mstEdges: [...mstEdges],
      fa: [...fa], currentEdgeIdx: -1
    });
  }
}

// ── Draw graph ──
function drawGraph(s) {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  const mstSet = new Set(s.mstEdges.map(e => `${Math.min(e.u,e.v)},${Math.max(e.u,e.v)}`));

  for (const e of graph.edges) {
    const u = graph.nodes[e.u-1], v = graph.nodes[e.v-1];
    const key = `${Math.min(e.u,e.v)},${Math.max(e.u,e.v)}`;
    let stroke = '#555', strokeW = 2, cls = '';

    if (s.currentEdgeIdx >= 0) {
      const ce = s.sorted[s.currentEdgeIdx];
      const ckey = `${Math.min(ce.u,ce.v)},${Math.max(ce.u,ce.v)}`;
      if (key === ckey) { stroke = '#ffd369'; strokeW = 3; }
    }
    if (mstSet.has(key)) { stroke = '#2e8b57'; strokeW = 3; }

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',u.x); line.setAttribute('y1',u.y);
    line.setAttribute('x2',v.x); line.setAttribute('y2',v.y);
    line.setAttribute('stroke',stroke); line.setAttribute('stroke-width',strokeW);
    svg.appendChild(line);

    const mx = (u.x+v.x)/2, my = (u.y+v.y)/2 - 8;
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',mx); txt.setAttribute('y',my);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill', mstSet.has(key) ? '#46d573' : '#aaa'); txt.setAttribute('font-size','14');
    txt.textContent = e.w; svg.appendChild(txt);
  }

  for (const nd of graph.nodes) {
    let fill = '#0f3460', stroke = '#e94560';
    if (s.currentEdgeIdx >= 0) {
      const ce = s.sorted[s.currentEdgeIdx];
      if (nd.id === ce.u || nd.id === ce.v) { fill = '#ffd369'; stroke = '#fff'; }
    }
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',nd.x); circle.setAttribute('cy',nd.y);
    circle.setAttribute('r',26); circle.setAttribute('fill',fill);
    circle.setAttribute('stroke',stroke); circle.setAttribute('stroke-width','2');
    g.appendChild(circle);
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',nd.x); txt.setAttribute('y',nd.y+6);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill','#fff');
    txt.setAttribute('font-size','18'); txt.setAttribute('font-weight','bold');
    txt.textContent = nd.label; g.appendChild(txt);
    svg.appendChild(g);
  }
}

function renderEdgeList(s) {
  const div = document.getElementById('edgeList');
  div.innerHTML = s.sorted.map((e, i) => {
    let cls = 'edge-item pending';
    if (i === s.currentEdgeIdx) cls = 'edge-item current';
    else if (s.edgeStatus[i] === 'added') cls = 'edge-item added';
    else if (s.edgeStatus[i] === 'rejected') cls = 'edge-item rejected';
    let status = '';
    if (s.edgeStatus[i] === 'added') status = ' ✓';
    else if (s.edgeStatus[i] === 'rejected') status = ' ✗';
    return `<div class="${cls}"><span>${e.u} — ${e.v} : ${e.w}</span><span>${status}</span></div>`;
  }).join('');

  if (s.type === 'done' || s.type === 'done_early' || s.type === 'done_partial') {
    const total = s.mstEdges.reduce((s, e) => s + e.w, 0);
    document.getElementById('totalCost').innerHTML = s.mstEdges.length >= N-1 ? `MST 总花费: <span>${total}</span>` : '不连通';
  } else {
    document.getElementById('totalCost').textContent = '';
  }
}

function renderDsuTable(s) {
  const tbl = document.getElementById('dsuTable');
  let html = '<tr><th>节点</th><th>fa[i]</th><th>根</th></tr>';
  // Compute root for each node
  function root(x, fa) {
    while (fa[x] !== x) x = fa[x];
    return x;
  }
  for (let i = 1; i <= N; i++) {
    const r = root(i, s.fa);
    html += `<tr><td>${i}</td><td>${s.fa[i]}</td><td>${r}</td></tr>`;
  }
  tbl.innerHTML = html;
}

function render(s) {
  drawGraph(s);
  renderEdgeList(s);
  renderDsuTable(s);
  document.getElementById('info').innerHTML = (s.detail ? s.desc + '<br><small style="color:#888">' + s.detail + '</small>' : s.desc);
  const mstCount = s.mstEdges ? s.mstEdges.length : 0;
  document.getElementById('status').textContent = s.type === 'init' ? `已选边: 0 / ${N-1}` : `已选边: ${mstCount} / ${N-1}`;
}

function step() { if (currentStep >= steps.length - 1) return; currentStep++; render(steps[currentStep]); updateButtons(); }
function updateButtons() { document.getElementById('btnStep').disabled = (currentStep >= steps.length - 1); document.getElementById('btnAuto').textContent = autoTimer ? '⏸ 暂停' : '▶ 自动播放'; }
function autoPlay() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; updateButtons(); return; }
  autoTimer = setInterval(() => { if (currentStep >= steps.length - 1) { clearInterval(autoTimer); autoTimer = null; updateButtons(); return; } step(); }, 1200 / speed);
  updateButtons();
}
function reset() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } currentStep = 0; buildSteps(); render(steps[0]); updateButtons(); }

function handleBuildGraph() {
  const nc = parseInt(document.getElementById('nodeCount').value, 10);
  const errorEl = document.getElementById('errorMsg');
  if (isNaN(nc) || nc < 2 || nc > 8) { errorEl.textContent = '节点数 N 必须在 2 到 8 之间'; return; }
  const raw = document.getElementById('edgeInput').value;
  const { edges, errors } = parseEdgeInput(raw);
  for (const [u, v] of edges) { if (u > nc) { errorEl.textContent = `边节点 ${u} 超出范围`; return; } if (v > nc) { errorEl.textContent = `边节点 ${v} 超出范围`; return; } }
  if (errors.length > 0) { errorEl.textContent = errors.join('\n'); return; }
  errorEl.textContent = '';
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  generateGraph(nc, edges);
  currentStep = 0; buildSteps(); render(steps[0]); updateButtons();
}

function loadPreset(key) {
  const p = presets[key]; if (!p) return;
  document.getElementById('nodeCount').value = p.nodeCount;
  document.getElementById('edgeInput').value = p.edges.map(e=>e.join(' ')).join('\n');
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`.preset-btn[data-preset="${key}"]`); if (btn) btn.classList.add('active');
  handleBuildGraph();
}

function renderPresetButtons() {
  const container = document.getElementById('presetBtns');
  for (const [key, p] of Object.entries(presets)) {
    const btn = document.createElement('button'); btn.className = 'preset-btn';
    btn.dataset.preset = key; btn.textContent = p.name; btn.onclick = () => loadPreset(key);
    container.appendChild(btn);
  }
}

document.getElementById('btnStep').onclick = step;
document.getElementById('btnAuto').onclick = autoPlay;
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnSpeed').onclick = function() {
  speed = speed >= 5 ? 1 : speed + 1; this.textContent = '速度: ' + speed + 'x';
  if (autoTimer) { clearInterval(autoTimer); autoTimer = setInterval(step, 1200 / speed); }
};
document.getElementById('panelToggle').onclick = () => document.getElementById('inputPanel').classList.toggle('collapsed');
document.getElementById('btnBuild').onclick = handleBuildGraph;

presets = definePresets();
renderPresetButtons();
loadPreset('3village');
</script>
</body>
</html>
