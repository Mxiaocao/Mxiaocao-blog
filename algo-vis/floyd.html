<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floyd-Warshall 算法可视化</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }
  h2 { margin-bottom: 20px; color: #e94560; }
  .container { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .graph-panel {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #0f3460;
  }
  .matrix-panel {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #0f3460;
  }
  .matrix-panel h3 { margin-bottom: 12px; color: #e94560; text-align: center; }
  table { border-collapse: collapse; }
  td {
    width: 70px; height: 50px;
    text-align: center;
    border: 1px solid #0f3460;
    font-size: 18px;
    font-weight: bold;
    transition: all 0.3s;
  }
  .row-label, .col-label { color: #888; font-size: 13px; font-weight: normal; }
  .inf { color: #666; }
  .highlight-k { background: rgba(233,69,96,0.3) !important; }
  .highlight-i { background: rgba(0,173,181,0.3) !important; }
  .highlight-j { background: rgba(255,211,105,0.3) !important; }
  .highlight-update { background: rgba(46,213,115,0.5) !important; animation: pulse 0.6s; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 10px 20px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 15px; font-weight: bold;
    transition: all 0.2s;
  }
  button:hover { transform: translateY(-2px); }
  .btn-step { background: #e94560; color: #fff; }
  .btn-auto { background: #0f3460; color: #fff; }
  .btn-reset { background: #533483; color: #fff; }
  .btn-speed { background: #222831; color: #eee; }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .info {
    margin-top: 15px; padding: 12px 20px;
    background: #16213e; border-radius: 8px;
    border-left: 3px solid #e94560;
    font-size: 15px; max-width: 600px; text-align: center;
    min-height: 24px;
  }
  .info span { color: #e94560; font-weight: bold; }
  .status { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
  svg text { user-select: none; }
  svg .edge-label { font-size: 14px; fill: #aaa; }
  svg .node circle { transition: fill 0.3s; }
  .input-panel {
    background: #16213e; border-radius: 12px; border: 1px solid #0f3460;
    max-width: 820px; width: 100%; margin-bottom: 20px; overflow: hidden;
  }
  .input-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; cursor: pointer; user-select: none;
    background: rgba(233,69,96,0.08); transition: background 0.2s;
  }
  .input-panel-header:hover { background: rgba(233,69,96,0.15); }
  .input-panel-header h3 { margin: 0; font-size: 16px; color: #e94560; }
  .toggle-icon { font-size: 14px; color: #e94560; transition: transform 0.3s; }
  .input-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
  .panel-body { padding: 16px 20px; transition: all 0.3s; overflow: hidden; }
  .input-panel.collapsed .panel-body { max-height: 0; padding: 0 20px; opacity: 0; }
  .input-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label { font-size: 13px; color: #aaa; }
  .input-group input, .input-group textarea {
    background: #0f3460; border: 1px solid #1a508b; border-radius: 6px;
    color: #eee; padding: 8px 12px; font-size: 14px; font-family: 'Consolas','Courier New',monospace;
    outline: none; transition: border-color 0.2s;
  }
  .input-group input:focus, .input-group textarea:focus { border-color: #e94560; }
  .input-group input { width: 70px; }
  .input-group textarea { width: 100%; min-width: 260px; height: 80px; resize: vertical; }
  .preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 14px; border: 1px solid #1a508b; border-radius: 6px;
    background: transparent; color: #aaa; cursor: pointer; font-size: 13px;
    transition: all 0.2s;
  }
  .preset-btn:hover { border-color: #e94560; color: #eee; }
  .preset-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
  .btn-build {
    padding: 10px 28px; border: none; border-radius: 8px;
    background: #00adb5; color: #fff; cursor: pointer; font-size: 15px; font-weight: bold;
    transition: all 0.2s;
  }
  .btn-build:hover { background: #018c93; transform: translateY(-1px); }
  .error-msg { color: #e94560; font-size: 13px; min-height: 18px; margin-top: 2px; white-space: pre-line; }
</style>
</head>
<body>
<h2>Floyd-Warshall 算法可视化</h2>
<div class="input-panel" id="inputPanel">
  <div class="input-panel-header" id="panelToggle">
    <h3>自定义图参数</h3>
    <span class="toggle-icon">▼</span>
  </div>
  <div class="panel-body">
    <div class="input-row">
      <div class="input-group">
        <label>节点数 N (2-8)</label>
        <input type="number" id="nodeCount" min="2" max="8" value="3">
      </div>
      <div class="preset-btns" id="presetBtns"></div>
    </div>
    <div class="input-row">
      <div class="input-group" style="flex:1;min-width:280px;">
        <label>边列表（每行：u v w，空格分隔）</label>
        <textarea id="edgeInput" placeholder="1 2 8&#10;1 3 10&#10;2 3 1"></textarea>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="input-row">
      <button class="btn-build" id="btnBuild">生成图并重置</button>
    </div>
  </div>
</div>
<div class="container">
  <div class="graph-panel">
    <svg id="graph" width="380" height="320"></svg>
  </div>
  <div class="matrix-panel">
    <h3>dist[i][j] 距离矩阵</h3>
    <table id="matrix"></table>
  </div>
</div>
<div class="info" id="info">准备开始</div>
<div class="status" id="status">k=?, i=?, j=?</div>
<div class="controls">
  <button class="btn-step" id="btnStep">&#9654; 下一步</button>
  <button class="btn-auto" id="btnAuto">&#9654; 自动播放</button>
  <button class="btn-speed" id="btnSpeed">速度: 1x</button>
  <button class="btn-reset" id="btnReset">&#8635; 重置</button>
</div>

<script>
let N, graph, presets;
const INF = 999;
let dist;
let steps = [];
let currentStep = 0;
let autoTimer = null;
let speed = 1;

// ── Presets ──
function definePresets() {
  return {
    '3city': {
      name: '3城市', nodeCount: 3,
      edges: [[1,2,8],[1,3,10],[2,3,1]]
    },
    '4city': {
      name: '4城市', nodeCount: 4,
      edges: [[1,2,3],[1,4,7],[2,3,2],[3,4,1],[2,4,5]]
    },
    '5complex': {
      name: '5复杂', nodeCount: 5,
      edges: [[1,2,2],[1,3,4],[2,4,7],[3,4,3],[3,5,1],[4,5,1],[2,3,1],[1,5,10]]
    },
    'full4': {
      name: '4完全图', nodeCount: 4,
      edges: [[1,2,1],[1,3,5],[1,4,2],[2,3,3],[2,4,4],[3,4,1]]
    }
  };
}

// ── Parse edge input ──
function parseEdgeInput(text) {
  const edges = [];
  const errors = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(/\s+/);
    if (parts.length !== 3) {
      errors.push(`第${i+1}行格式错误，需要三个数字（u v w），实际得到 ${parts.length} 个`);
      continue;
    }
    const u = Number(parts[0]), v = Number(parts[1]), w = Number(parts[2]);
    if (isNaN(u) || isNaN(v) || isNaN(w)) {
      errors.push(`第${i+1}行包含非数字内容: "${line}"`);
      continue;
    }
    if (u < 1 || v < 1) {
      errors.push(`第${i+1}行节点编号必须 >= 1: "${line}"`);
      continue;
    }
    edges.push([u, v, w]);
  }
  return { edges, errors };
}

// ── Generate graph with circle layout ──
function generateGraph(nodeCount, edgeList) {
  const margin = 55;
  let R;
  if (nodeCount <= 4) R = 120;
  else if (nodeCount <= 6) R = 145;
  else R = 165;
  const side = 2 * (R + margin);
  const cx = side / 2, cy = side / 2;

  const svg = document.getElementById('graph');
  svg.setAttribute('width', side);
  svg.setAttribute('height', side);
  svg.setAttribute('viewBox', `0 0 ${side} ${side}`);

  const nodes = [];
  for (let i = 1; i <= nodeCount; i++) {
    const angle = (2 * Math.PI * (i - 1)) / nodeCount - Math.PI / 2;
    nodes.push({
      id: i,
      x: Math.round(cx + R * Math.cos(angle)),
      y: Math.round(cy + R * Math.sin(angle)),
      label: String(i)
    });
  }

  // Deduplicate edges: keep min weight per unordered pair
  const edgeMap = new Map();
  for (const [u, v, w] of edgeList) {
    if (u === v) continue; // skip self-loops
    if (u < 1 || u > nodeCount || v < 1 || v > nodeCount) continue;
    const key = u < v ? `${u},${v}` : `${v},${u}`;
    if (!edgeMap.has(key) || w < edgeMap.get(key).w) {
      edgeMap.set(key, { u, v, w });
    }
  }
  const edges = Array.from(edgeMap.values());

  graph = { nodes, edges };
  N = nodeCount;
}

// ── Handle build ──
function handleBuildGraph() {
  const nc = parseInt(document.getElementById('nodeCount').value, 10);
  const errorEl = document.getElementById('errorMsg');

  if (isNaN(nc) || nc < 2 || nc > 8) {
    errorEl.textContent = '节点数 N 必须在 2 到 8 之间';
    return;
  }

  const raw = document.getElementById('edgeInput').value;
  const { edges, errors } = parseEdgeInput(raw);

  // Check for out-of-range node references
  for (const [u, v] of edges) {
    if (u > nc) { errorEl.textContent = `边 (${u},${v}) 节点 ${u} 超出范围（N=${nc}）`; return; }
    if (v > nc) { errorEl.textContent = `边 (${u},${v}) 节点 ${v} 超出范围（N=${nc}）`; return; }
  }

  if (errors.length > 0) {
    errorEl.textContent = errors.join('\n');
    return;
  }

  errorEl.textContent = '';

  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }

  // Deactivate all preset buttons (user has custom input)
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));

  generateGraph(nc, edges);
  currentStep = 0;
  initDist();
  buildSteps();
  render(steps[0]);
  updateButtons();
}

// ── Load preset ──
function loadPreset(key) {
  const p = presets[key];
  if (!p) return;
  document.getElementById('nodeCount').value = p.nodeCount;
  document.getElementById('edgeInput').value = p.edges.map(e => e.join(' ')).join('\n');
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.preset-btn[data-preset="${key}"]`);
  if (btn) btn.classList.add('active');
  handleBuildGraph();
}

// ── Render preset buttons ──
function renderPresetButtons() {
  const container = document.getElementById('presetBtns');
  for (const [key, p] of Object.entries(presets)) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.dataset.preset = key;
    btn.textContent = p.name;
    btn.onclick = () => loadPreset(key);
    container.appendChild(btn);
  }
}

function initDist() {
  dist = [];
  for (let i = 1; i <= N; i++) {
    dist[i] = [];
    for (let j = 1; j <= N; j++) {
      dist[i][j] = (i === j) ? 0 : INF;
    }
  }
  for (let e of graph.edges) {
    dist[e.u][e.v] = Math.min(dist[e.u][e.v], e.w);
    dist[e.v][e.u] = Math.min(dist[e.v][e.u], e.w);
  }
}

function buildSteps() {
  // Capture initial state
  steps = [{k:0, i:0, j:0, changed:null, desc:'初始状态：直飞票价', matrix: JSON.parse(JSON.stringify(dist))}];

  for (let k = 1; k <= N; k++) {
    steps.push({k:k, i:0, j:0, changed:null, desc:`开始尝试以城市 ${k} 作为中转站`, matrix: JSON.parse(JSON.stringify(dist))});
    for (let i = 1; i <= N; i++) {
      for (let j = 1; j <= N; j++) {
        if (i === j) continue;
        if (dist[i][k] < INF && dist[k][j] < INF) {
          let old = dist[i][j];
          let via = dist[i][k] + dist[k][j];
          if (via < old) {
            dist[i][j] = via;
            steps.push({
              k:k, i:i, j:j, changed:true,
              desc:`<span>优化！</span>dist[${i}][${j}] 从 ${old} 变成 ${via}（${i}→${k}→${j}：${dist[i][k]}+${dist[k][j]}=${via} < ${old}）`,
              matrix: JSON.parse(JSON.stringify(dist))
            });
          } else {
            steps.push({
              k:k, i:i, j:j, changed:false,
              desc:`dist[${i}][${j}]=${old}，经${k}中转: ${dist[i][k]}+${dist[k][j]}=${via}，没有更优`,
              matrix: JSON.parse(JSON.stringify(dist))
            });
          }
        }
      }
    }
  }
  steps.push({k:0, i:0, j:0, changed:null, desc:'算法结束！所有点对最短路径已求出', matrix: JSON.parse(JSON.stringify(dist))});
}

function drawGraph(s) {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  // Draw edges
  for (let e of graph.edges) {
    const u = graph.nodes[e.u-1], v = graph.nodes[e.v-1];
    let stroke = '#555', strokeW = 2;
    // Highlight if this edge participates in current step
    if (s.k > 0 && s.i > 0 && s.j > 0 && s.changed) {
      if ((e.u === s.i && e.v === s.k) || (e.v === s.i && e.u === s.k) ||
          (e.u === s.k && e.v === s.j) || (e.v === s.k && e.u === s.j)) {
        stroke = '#e94560'; strokeW = 3;
      }
    }
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',u.x); line.setAttribute('y1',u.y);
    line.setAttribute('x2',v.x); line.setAttribute('y2',v.y);
    line.setAttribute('stroke',stroke); line.setAttribute('stroke-width',strokeW);
    svg.appendChild(line);

    // Edge label
    const mx = (u.x+v.x)/2, my = (u.y+v.y)/2 - 8;
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',mx); txt.setAttribute('y',my);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('fill','#aaa'); txt.setAttribute('font-size','14');
    txt.textContent = e.w;
    svg.appendChild(txt);
  }

  // Draw nodes
  for (let nd of graph.nodes) {
    let fill = '#0f3460';
    let stroke = '#e94560';
    if (nd.id === s.k) { fill = '#e94560'; stroke = '#fff'; }
    else if (nd.id === s.i) { fill = '#00adb5'; stroke = '#fff'; }
    else if (nd.id === s.j) { fill = '#ffd369'; stroke = '#fff'; }

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',nd.x); circle.setAttribute('cy',nd.y);
    circle.setAttribute('r',26); circle.setAttribute('fill',fill);
    circle.setAttribute('stroke',stroke); circle.setAttribute('stroke-width','2');
    g.appendChild(circle);

    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',nd.x); txt.setAttribute('y',nd.y+6);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill','#fff');
    txt.setAttribute('font-size','18'); txt.setAttribute('font-weight','bold');
    txt.textContent = nd.label;
    g.appendChild(txt);

    if (nd.id === s.k) {
      const ktxt = document.createElementNS('http://www.w3.org/2000/svg','text');
      ktxt.setAttribute('x',nd.x); ktxt.setAttribute('y',nd.y-36);
      ktxt.setAttribute('text-anchor','middle'); ktxt.setAttribute('fill','#e94560');
      ktxt.setAttribute('font-size','12'); ktxt.setAttribute('font-weight','bold');
      ktxt.textContent = 'k='+nd.id;
      g.appendChild(ktxt);
    }

    svg.appendChild(g);
  }
}

function renderMatrix(s) {
  const tbl = document.getElementById('matrix');
  let html = '<tr><td class="col-label">i\\j</td>';
  for (let j = 1; j <= N; j++) html += `<td class="col-label">${j}</td>`;
  html += '</tr>';

  for (let i = 1; i <= N; i++) {
    html += '<tr>';
    html += `<td class="row-label">${i}</td>`;
    for (let j = 1; j <= N; j++) {
      let cls = '';
      if (s.k > 0 && s.i === i && s.j === j && s.changed) cls = 'highlight-update';
      else if (s.k > 0 && i === s.k) cls = 'highlight-k';
      else if (s.k > 0 && i === s.i && j !== s.i) cls = 'highlight-i';
      else if (s.k > 0 && j === s.j && i !== s.j) cls = 'highlight-j';

      let val = s.matrix[i][j];
      let display = val >= INF ? '<span class="inf">∞</span>' : val;
      html += `<td class="${cls}">${display}</td>`;
    }
    html += '</tr>';
  }
  tbl.innerHTML = html;
}

function render(s) {
  drawGraph(s);
  renderMatrix(s);
  document.getElementById('info').innerHTML = s.desc;
  if (s.k > 0) {
    document.getElementById('status').textContent = `k=${s.k}, i=${s.i||'?'}, j=${s.j||'?'}`;
  } else {
    document.getElementById('status').textContent = '';
  }
}

function step() {
  if (currentStep >= steps.length - 1) return;
  currentStep++;
  render(steps[currentStep]);
  updateButtons();
}

function updateButtons() {
  document.getElementById('btnStep').disabled = (currentStep >= steps.length - 1);
  document.getElementById('btnAuto').textContent = autoTimer ? '⏸ 暂停' : '▶ 自动播放';
}

function autoPlay() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    updateButtons();
    return;
  }
  autoTimer = setInterval(() => {
    if (currentStep >= steps.length - 1) {
      clearInterval(autoTimer);
      autoTimer = null;
      updateButtons();
      return;
    }
    step();
  }, 1200 / speed);
  updateButtons();
}

function reset() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentStep = 0;
  initDist();
  buildSteps();
  render(steps[0]);
  updateButtons();
}

document.getElementById('btnStep').onclick = step;
document.getElementById('btnAuto').onclick = autoPlay;
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnSpeed').onclick = function() {
  speed = speed >= 5 ? 1 : speed + 1;
  this.textContent = '速度: ' + speed + 'x';
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = setInterval(step, 1200 / speed);
  }
};

// Initialize
presets = definePresets();
renderPresetButtons();

// Panel toggle
document.getElementById('panelToggle').onclick = function() {
  document.getElementById('inputPanel').classList.toggle('collapsed');
};
document.getElementById('btnBuild').onclick = handleBuildGraph;

loadPreset('3city');
</script>
</body>
</html>
