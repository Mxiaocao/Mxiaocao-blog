<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijkstra 算法可视化</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e; color: #eee; display: flex;
  flex-direction: column; align-items: center; padding: 10px; min-height: 100vh;
}
h2 { margin-bottom: 10px; color: #e94560; font-size: 20px; }
.container { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.graph-panel { background: #16213e; border-radius: 12px; padding: 12px; border: 1px solid #0f3460; }
.data-panel { background: #16213e; border-radius: 12px; padding: 12px; border: 1px solid #0f3460; min-width: 240px; }
.data-panel h3 { margin-bottom: 12px; color: #e94560; text-align: center; font-size: 15px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 14px; text-align: center; border: 1px solid #0f3460; font-size: 14px; }
th { color: #888; font-size: 12px; font-weight: normal; }
td { font-weight: bold; transition: all 0.3s; }
.inf { color: #666; }
.settled { background: rgba(46,213,115,0.2); }
.current { background: rgba(255,211,105,0.3); }
.updated { background: rgba(46,213,115,0.5) !important; animation: pulse 0.6s; }
.src-row { color: #e94560; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.controls { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; position: sticky; bottom: 0; background: #1a1a2e; padding: 10px 0; z-index: 10; }
button { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; }
button:hover { transform: translateY(-2px); }
.btn-step { background: #e94560; color: #fff; }
.btn-auto { background: #0f3460; color: #fff; }
.btn-reset { background: #533483; color: #fff; }
.btn-speed { background: #222831; color: #eee; }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.info { margin-top: 8px; padding: 10px 16px; background: #16213e; border-radius: 8px; border-left: 3px solid #e94560; font-size: 15px; max-width: 600px; text-align: center; min-height: 24px; }
.info span { color: #e94560; font-weight: bold; }
.status { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
svg text { user-select: none; }
svg .edge-label { font-size: 14px; fill: #aaa; }
svg .node circle { transition: fill 0.3s; }
.input-panel { background: #16213e; border-radius: 12px; border: 1px solid #0f3460; max-width: 820px; width: 100%; margin-bottom: 20px; overflow: hidden; }
.input-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; user-select: none; background: rgba(233,69,96,0.08); transition: background 0.2s; }
.input-panel-header:hover { background: rgba(233,69,96,0.15); }
.input-panel-header h3 { margin: 0; font-size: 16px; color: #e94560; }
.toggle-icon { font-size: 14px; color: #e94560; transition: transform 0.3s; }
.input-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
.panel-body { padding: 16px 20px; transition: all 0.3s; overflow: hidden; }
.input-panel.collapsed .panel-body { max-height: 0; padding: 0 20px; opacity: 0; }
.input-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
.input-group { display: flex; flex-direction: column; gap: 4px; }
.input-group label { font-size: 13px; color: #aaa; }
.input-group input, .input-group textarea { background: #0f3460; border: 1px solid #1a508b; border-radius: 6px; color: #eee; padding: 8px 12px; font-size: 14px; font-family: 'Consolas','Courier New',monospace; outline: none; transition: border-color 0.2s; }
.input-group input:focus, .input-group textarea:focus { border-color: #e94560; }
.input-group input { width: 70px; }
.input-group textarea { width: 100%; min-width: 260px; height: 80px; resize: vertical; }
.preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.preset-btn { padding: 6px 14px; border: 1px solid #1a508b; border-radius: 6px; background: transparent; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.preset-btn:hover { border-color: #e94560; color: #eee; }
.preset-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.btn-build { padding: 10px 28px; border: none; border-radius: 8px; background: #00adb5; color: #fff; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.2s; }
.btn-build:hover { background: #018c93; transform: translateY(-1px); }
.error-msg { color: #e94560; font-size: 13px; min-height: 18px; margin-top: 2px; white-space: pre-line; }
.source-badge { display: inline-block; background: #e94560; color: #fff; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 12px; margin-left: 4px; }
</style>
</head>
<body>
<h2>Dijkstra 最短路算法可视化</h2>
<div class="input-panel collapsed" id="inputPanel">
  <div class="input-panel-header" id="panelToggle"><h3>自定义图参数</h3><span class="toggle-icon">▼</span></div>
  <div class="panel-body">
    <div class="input-row">
      <div class="input-group"><label>节点数 N (2-8)</label><input type="number" id="nodeCount" min="2" max="8" value="5"></div>
      <div class="input-group"><label>源点 Src</label><input type="number" id="srcNode" min="1" max="8" value="1"></div>
      <div class="preset-btns" id="presetBtns"></div>
    </div>
    <div class="input-row">
      <div class="input-group" style="flex:1;min-width:280px;">
        <label>边列表（每行：u v w）</label>
        <textarea id="edgeInput" placeholder="1 2 5&#10;1 3 2&#10;1 4 7&#10;2 4 1&#10;2 5 3&#10;3 4 3&#10;4 5 1"></textarea>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="input-row"><button class="btn-build" id="btnBuild">生成图并重置</button></div>
  </div>
</div>
<div class="container">
  <div class="graph-panel"><svg id="graph" width="380" height="320"></svg></div>
  <div class="data-panel">
    <h3>dist[] & ok[] 状态</h3>
    <table id="dataTable"></table>
  </div>
</div>
<div class="info" id="info">准备开始</div>
<div class="status" id="status"></div>
<div class="controls">
  <button class="btn-step" id="btnStep">▶ 下一步</button>
  <button class="btn-auto" id="btnAuto">▶ 自动播放</button>
  <button class="btn-speed" id="btnSpeed">速度: 1x</button>
  <button class="btn-reset" id="btnReset">↻ 重置</button>
</div>

<script>
let N, graph, presets, source;
const INF = 999;
let steps = [], currentStep = 0, autoTimer = null, speed = 1;

function definePresets() {
  return {
    '5node': {
      name: '5节点', nodeCount: 5, source: 1,
      edges: [[1,2,5],[1,3,2],[1,4,7],[2,4,1],[2,5,3],[3,4,3],[4,5,1]]
    },
    '4node': {
      name: '4简单', nodeCount: 4, source: 1,
      edges: [[1,2,4],[1,3,1],[2,4,2],[3,2,2],[3,4,5]]
    },
    '6node': {
      name: '6节点', nodeCount: 6, source: 1,
      edges: [[1,2,7],[1,3,9],[1,6,14],[2,3,10],[2,4,15],[3,4,11],[3,6,2],[4,5,6],[6,5,9]]
    }
  };
}

function parseEdgeInput(text) {
  const edges = [], errors = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(/\s+/);
    if (parts.length !== 3) { errors.push(`第${i+1}行需要3个数字（u v w），得到 ${parts.length} 个`); continue; }
    const u = Number(parts[0]), v = Number(parts[1]), w = Number(parts[2]);
    if (isNaN(u) || isNaN(v) || isNaN(w)) { errors.push(`第${i+1}行含非数字: "${line}"`); continue; }
    if (u < 1 || v < 1) { errors.push(`第${i+1}行节点编号必须 >= 1`); continue; }
    edges.push([u, v, w]);
  }
  return { edges, errors };
}

function generateGraph(nodeCount, edgeList) {
  const margin = 55;
  let R = nodeCount <= 4 ? 120 : nodeCount <= 6 ? 145 : 165;
  const side = 2 * (R + margin), cx = side / 2, cy = side / 2;
  const svg = document.getElementById('graph');
  svg.setAttribute('width', side); svg.setAttribute('height', side);
  svg.setAttribute('viewBox', `0 0 ${side} ${side}`);
  const nodes = [];
  for (let i = 1; i <= nodeCount; i++) {
    const angle = (2 * Math.PI * (i - 1)) / nodeCount - Math.PI / 2;
    nodes.push({ id: i, x: Math.round(cx + R * Math.cos(angle)), y: Math.round(cy + R * Math.sin(angle)), label: String(i) });
  }
  const edgeMap = new Map();
  for (const [u, v, w] of edgeList) {
    if (u === v || u < 1 || u > nodeCount || v < 1 || v > nodeCount) continue;
    const key = u < v ? `${u},${v}` : `${v},${u}`;
    if (!edgeMap.has(key) || w < edgeMap.get(key).w) edgeMap.set(key, { u, v, w });
  }
  graph = { nodes, edges: Array.from(edgeMap.values()) };
  N = nodeCount;
}

function treeEdgesFromPre(pre, ok) {
  const set = [];
  for (let i = 1; i <= N; i++) {
    if (pre[i] !== 0 && ok[i]) set.push([pre[i], i]);
  }
  return set;
}

function buildSteps() {
  const dist = [], ok = [], pre = [];
  const adj = Array.from({length: N+1}, () => []);
  for (const e of graph.edges) {
    adj[e.u].push({ to: e.v, w: e.w });
    adj[e.v].push({ to: e.u, w: e.w });
  }
  for (let i = 1; i <= N; i++) { dist[i] = INF; ok[i] = false; pre[i] = 0; }
  dist[source] = 0;

  steps = [{ type: 'init', node: source, dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: [], desc: `初始化：源点 <span>${source}</span> dist=0，其余点 dist=∞`, settled: [...ok] }];

  for (let iter = 1; iter < N; iter++) {
    let mindist = INF, k = -1;
    for (let j = 1; j <= N; j++) {
      if (!ok[j] && dist[j] < mindist) { mindist = dist[j]; k = j; }
    }
    if (k === -1) break;
    steps.push({ type: 'pick', node: k, dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: treeEdgesFromPre(pre, ok), desc: `选择 dist 最小的未确定节点 <span>${k}</span>（dist=${mindist}），标记为已确定`, settled: [...ok] });

    ok[k] = true;
    steps.push({ type: 'settle', node: k, dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: treeEdgesFromPre(pre, ok), desc: `节点 <span>${k}</span> 已确定，开始松弛它的邻边`, settled: [...ok] });

    for (const { to: j, w } of adj[k]) {
      if (ok[j]) continue;
      const old = dist[j], via = dist[k] + w;
      if (via < old) {
        dist[j] = via;
        pre[j] = k;
        steps.push({ type: 'relax', node: k, edge: [k, j], from: old, to: via, dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: treeEdgesFromPre(pre, ok), desc: `<span>更新！</span>dist[${j}] ${old} → ${via}（经${k}中转: ${dist[k]}+${w}=${via} < ${old}）`, settled: [...ok] });
      } else {
        steps.push({ type: 'norelax', node: k, edge: [k, j], dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: treeEdgesFromPre(pre, ok), desc: `dist[${j}]=${old}，经${k}: ${dist[k]}+${w}=${via}，没有更优`, settled: [...ok] });
      }
    }
  }
  steps.push({ type: 'done', dist: [...dist], ok: [...ok], pre: [...pre], treeEdges: treeEdgesFromPre(pre, ok), desc: '算法结束！所有节点最短距离已确定', settled: [...ok] });
}

function drawGraph(s) {
  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  const treeSet = new Set((s.treeEdges || []).map(e => `${Math.min(e[0],e[1])},${Math.max(e[0],e[1])}`));
  let activeKey = null;
  if (s.edge) activeKey = `${Math.min(s.edge[0],s.edge[1])},${Math.max(s.edge[0],s.edge[1])}`;

  for (const e of graph.edges) {
    const u = graph.nodes[e.u-1], v = graph.nodes[e.v-1];
    const key = `${Math.min(e.u,e.v)},${Math.max(e.u,e.v)}`;
    let stroke = '#555', strokeW = 2;
    if (key === activeKey) { stroke = '#ff9800'; strokeW = 3; }
    else if (treeSet.has(key)) { stroke = '#46d573'; strokeW = 3; }
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',u.x); line.setAttribute('y1',u.y);
    line.setAttribute('x2',v.x); line.setAttribute('y2',v.y);
    line.setAttribute('stroke',stroke); line.setAttribute('stroke-width',strokeW);
    svg.appendChild(line);
    const mx = (u.x+v.x)/2, my = (u.y+v.y)/2 - 8;
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',mx); txt.setAttribute('y',my);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('fill', treeSet.has(key) ? '#46d573' : '#aaa');
    txt.setAttribute('font-size','14');
    txt.textContent = e.w; svg.appendChild(txt);
  }
  for (const nd of graph.nodes) {
    let fill = '#0f3460', stroke = '#e94560';
    if (nd.id === source) { fill = '#e94560'; stroke = '#fff'; }
    else if (s.settled && s.settled[nd.id]) { fill = '#2e8b57'; stroke = '#46d573'; }
    if (s.node === nd.id && s.type !== 'init') { fill = '#ffd369'; stroke = '#fff'; }
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',nd.x); circle.setAttribute('cy',nd.y);
    circle.setAttribute('r',26); circle.setAttribute('fill',fill);
    circle.setAttribute('stroke',stroke); circle.setAttribute('stroke-width','2');
    g.appendChild(circle);
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',nd.x); txt.setAttribute('y',nd.y+6);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('fill','#fff');
    txt.setAttribute('font-size','18'); txt.setAttribute('font-weight','bold');
    txt.textContent = nd.label; g.appendChild(txt);
    if (nd.id === source) {
      const stxt = document.createElementNS('http://www.w3.org/2000/svg','text');
      stxt.setAttribute('x',nd.x); stxt.setAttribute('y',nd.y-36);
      stxt.setAttribute('text-anchor','middle'); stxt.setAttribute('fill','#e94560');
      stxt.setAttribute('font-size','11'); stxt.setAttribute('font-weight','bold');
      stxt.textContent = 'SRC'; g.appendChild(stxt);
    }
    svg.appendChild(g);
  }
}

function renderDataTable(s) {
  const tbl = document.getElementById('dataTable');
  let html = '<tr><th>节点</th><th>dist[i]</th><th>前驱</th><th>状态</th></tr>';
  for (let i = 1; i <= N; i++) {
    let cls = '', status = '未确定';
    if (i === source) cls = 'src-row';
    if (s.settled && s.settled[i]) { cls += ' settled'; status = '已确定 ✓'; }
    if (s.node === i && s.type !== 'init' && !s.settled[i]) cls += ' current';
    const d = s.dist[i];
    const p = (s.pre && s.pre[i]) ? s.pre[i] : '-';
    html += `<tr class="${cls}"><td>${i}</td><td>${
      d >= INF ? '<span class="inf">∞</span>' : d
    }</td><td>${p}</td><td>${status}</td></tr>`;
  }
  tbl.innerHTML = html;
}

function render(s) {
  drawGraph(s);
  renderDataTable(s);
  document.getElementById('info').innerHTML = s.desc;
  document.getElementById('status').textContent = s.type === 'done' ? '' : `已确定: ${s.settled?.filter(Boolean).length||0} / ${N}`;
}

function step() { if (currentStep >= steps.length - 1) return; currentStep++; render(steps[currentStep]); updateButtons(); }
function updateButtons() { document.getElementById('btnStep').disabled = (currentStep >= steps.length - 1); document.getElementById('btnAuto').textContent = autoTimer ? '⏸ 暂停' : '▶ 自动播放'; }
function autoPlay() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; updateButtons(); return; }
  autoTimer = setInterval(() => { if (currentStep >= steps.length - 1) { clearInterval(autoTimer); autoTimer = null; updateButtons(); return; } step(); }, 1200 / speed);
  updateButtons();
}
function reset() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentStep = 0; buildSteps(); render(steps[0]); updateButtons();
}

function handleBuildGraph() {
  const nc = parseInt(document.getElementById('nodeCount').value, 10);
  const sc = parseInt(document.getElementById('srcNode').value, 10);
  const errorEl = document.getElementById('errorMsg');
  if (isNaN(nc) || nc < 2 || nc > 8) { errorEl.textContent = '节点数 N 必须在 2 到 8 之间'; return; }
  if (isNaN(sc) || sc < 1 || sc > nc) { errorEl.textContent = `源点必须在 1 到 ${nc} 之间`; return; }
  const raw = document.getElementById('edgeInput').value;
  const { edges, errors } = parseEdgeInput(raw);
  for (const [u, v] of edges) { if (u > nc) { errorEl.textContent = `边节点 ${u} 超出范围（N=${nc}）`; return; } if (v > nc) { errorEl.textContent = `边节点 ${v} 超出范围（N=${nc}）`; return; } }
  if (errors.length > 0) { errorEl.textContent = errors.join('\n'); return; }
  errorEl.textContent = '';
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  source = sc;
  generateGraph(nc, edges);
  currentStep = 0; buildSteps(); render(steps[0]); updateButtons();
}

function loadPreset(key) {
  const p = presets[key]; if (!p) return;
  document.getElementById('nodeCount').value = p.nodeCount;
  document.getElementById('srcNode').value = p.source;
  document.getElementById('edgeInput').value = p.edges.map(e=>e.join(' ')).join('\n');
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`.preset-btn[data-preset="${key}"]`); if (btn) btn.classList.add('active');
  handleBuildGraph();
}

function renderPresetButtons() {
  const container = document.getElementById('presetBtns');
  for (const [key, p] of Object.entries(presets)) {
    const btn = document.createElement('button'); btn.className = 'preset-btn';
    btn.dataset.preset = key; btn.textContent = p.name; btn.onclick = () => loadPreset(key);
    container.appendChild(btn);
  }
}

document.getElementById('btnStep').onclick = step;
document.getElementById('btnAuto').onclick = autoPlay;
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnSpeed').onclick = function() {
  speed = speed >= 5 ? 1 : speed + 1; this.textContent = '速度: ' + speed + 'x';
  if (autoTimer) { clearInterval(autoTimer); autoTimer = setInterval(step, 1200 / speed); }
};
document.getElementById('panelToggle').onclick = () => document.getElementById('inputPanel').classList.toggle('collapsed');
document.getElementById('btnBuild').onclick = handleBuildGraph;

presets = definePresets();
renderPresetButtons();
loadPreset('5node');
</script>
</body>
</html>
